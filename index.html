<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrillCaddie - Fix Your Swing</title>
    <style>
        /* Mobile-First Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 15px;
        }

        header {
            text-align: center;
            padding: 20px 0;
        }

        header h1 {
            color: #1b4332; /* Golf Green */
            margin: 0;
            font-size: 28px;
        }

        .selector-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* Large, easy-to-tap buttons for the practice range */
        .flaw-btn {
            background-color: #ffffff;
            border: 2px solid #1b4332;
            color: #1b4332;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            padding-left: 20px;
        }

        .flaw-btn.active {
            background-color: #1b4332;
            color: #ffffff;
        }

        .drill-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: none; /* Hidden until a button is clicked */
            margin-bottom: 30px;
        }

        #drill-description {
            line-height: 1.5;
            font-size: 15px;
            margin-bottom: 20px;
        }

        .gear-section {
            margin-top: 20px;
            border-top: 2px dashed #e5e7eb;
            padding-top: 20px;
        }

        .gear-section h3 {
            font-size: 18px;
            color: #1b4332;
            margin-top: 0;
        }

        .gear-card {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .gear-title {
            font-weight: bold;
            font-size: 15px;
            margin: 0;
        }

        .amazon-btn {
            display: block;
            text-align: center;
            background-color: #ff9900; /* Amazon Orange */
            color: #111;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>DrillCaddie</h1>
        <p>Select your miss to get an instant fix.</p>
    </header>

    <!-- 1. Expanded Swing Flaw Selector Buttons (No Emojis) -->
    <div class="selector-container">
        <button class="flaw-btn" onclick="showDrill('shank', this)">I'm Shanking It</button>
        <button class="flaw-btn" onclick="showDrill('slice', this)">I'm Slicing (Curving Right)</button>
        <button class="flaw-btn" onclick="showDrill('hook', this)">I'm Hooking (Curving Left)</button>
        <button class="flaw-btn" onclick="showDrill('chunk', this)">I'm Hitting It Fat / Chunking</button>
        <button class="flaw-btn" onclick="showDrill('blade', this)">I'm Blading / Thinning It</button>
        <button class="flaw-btn" onclick="showDrill('whiff', this)">I'm Whiffing / Missing Entirely</button>
    </div>

    <!-- 2. Dynamic Drill Display Area (Video Completely Removed) -->
    <div id="drill-display" class="drill-card">
        <h2 id="drill-title">Drill Name</h2>
        <p id="drill-description">Drill instructions go here.</p>

        <!-- 3. Dynamic Amazon Affiliate Links Section -->
        <div class="gear-section">
            <h3>Recommended Range Tools For This Drill:</h3>
            <div id="gear-container">
                <!-- Amazon links injected here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Data and Logic -->
    <script>
        // Expanded database of 6 drills with your live affiliate links
        const drillsData = {
            shank: {
                title: "The Alignment Stick Gate Drill",
                description: "Place an alignment stick just outside your golf ball, parallel to your target line. Focus on swinging through the gate without striking the stick. This forces your path back inside to eliminate the hosel rocket.",
                gear: [
                    {
                        name: "Golf Alignment Sticks (2-Pack)",
                        link: "https://amzn.to/4v1BY9T"
                    },
                    {
                        name: "Premium Golf Impact Tape (See face contact)",
                        link: "https://amzn.to/3WhiteMdsN"
                    }
                ]
            },
            slice: {
                title: "The Headcover Object Drill",
                description: "Place your driver headcover roughly 4 inches outside and slightly behind your ball. If you come over-the-top (the classic slice swing), you will hit the headcover. Swing inside it to force a proper inside-out path.",
                gear: [
                    {
                        name: "Golf Alignment & Path Training Sticks",
                        link: "https://amzn.to/49E0x4g"
                    }
                ]
            },
            hook: {
                title: "The Open Face Grip Check",
                description: "Hooks usually happen from a hyper-active closed clubface or coming way too far from the inside. Neutralize your grip by ensuring the 'V' shapes formed by your thumbs point toward your trailing shoulder, and practice hitting soft fades.",
                gear: [
                    {
                        name: "Golf Grip Trainer Attachment",
                        link: "https://amzn.to/3PACLPM"
                    }
                ]
            },
            chunk: {
                title: "The Towel Low-Point Drill",
                description: "Lay a flat golf towel flat on the grass roughly 3 to 4 inches behind your golf ball. Practice taking your swing. If you hit the towel, your club is bottoming out too early. Your goal is to miss the towel and strike the ball cleanly first.",
                gear: [
                    {
                        name: "Microfiber Golf Towel Set",
                        link: "https://amzn.to/3R8biWm"
                    },
                    {
                        name: "Golf Divot Dynamic Tracking Mat",
                        link: "https://amzn.to/49UE9DM"
                    }
                ]
            },
            blade: {
                title: "The Coin Strike Drill",
                description: "Place a flat coin exactly two inches in front of your golf ball. Your goal is to crisp the ball cleanly and make sure your club head divot strikes or moves the coin after impact.",
                gear: [
                    {
                        name: "Heavy-Duty Golf Practice Impact Mat",
                        link: "https://amzn.to/4dQQSK7"
                    }
                ]
            },
            whiff: {
                title: "The Tee Height Consistency Drill",
                description: "Push a tee completely flush with the ground. Practice clipping the top of the tee without a ball. If you miss the tee entirely, your posture or depth is changing during the swing.",
                gear: [
                    {
                        name: "pro plastic golf tees (100pcs)",
                        link: "https://amzn.to/4wBoOSx"
                    }
                ]
            }
        };

        function showDrill(flawKey, clickedButton) {
            const drill = drillsData[flawKey];
            
            document.getElementById("drill-title").innerText = drill.title;
            document.getElementById("drill-description").innerText = drill.description;
            
            const gearContainer = document.getElementById("gear-container");
            gearContainer.innerHTML = "";
            
            drill.gear.forEach(item => {
                const gearHTML = `
                    <div class="gear-card">
                        <p class="gear-title">${item.name}</p>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="amazon-btn">
                            View Tool on Amazon ➔
                        </a>
                    </div>
                `;
                gearContainer.innerHTML += gearHTML;
            });
            
            document.getElementById("drill-display").style.display = "block";
            
            const buttons = document.querySelectorAll('.flaw-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            clickedButton.classList.add('active');

            document.getElementById("drill-display").scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
