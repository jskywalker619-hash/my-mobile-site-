<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DrillCaddie - Fix Your Golf Swing</title>
    <style>
        /* Modern CSS Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-green: #2ecc71;
            --dark-green: #27ae60;
            --dark-bg: #1e272e;
            --light-bg: #f5f6fa;
            --text-dark: #2f3640;
            --text-light: #ffffff;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* App Containers */
        .page {
            display: none; /* Hidden by default, controlled by JS */
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            background: var(--text-light);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .active {
            display: block; /* Show active page */
        }

        /* Typography */
        h1 {
            font-size: 2.5rem;
            color: var(--dark-bg);
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        h1 span {
            color: var(--primary-green);
        }

        p.tagline {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 2rem;
            line-height: 1.4;
        }

        h2 {
            margin-bottom: 1.5rem;
            color: var(--dark-bg);
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--dark-bg);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: var(--primary-green);
        }

        textarea {
            resize: none;
            height: 100px;
            margin-bottom: 1rem;
        }

        /* Buttons */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.9rem;
            background-color: var(--primary-green);
            color: var(--text-light);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--dark-green);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* AI Results Box */
        .results-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #ebfcf2;
            border-left: 5px solid var(--primary-green);
            border-radius: 4px;
            text-align: left;
            display: none;
        }

        .results-box h3 {
            color: var(--dark-green);
            margin-bottom: 0.5rem;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- PAGE 1: HOMEPAGE -->
    <div id="homepage" class="page active">
        <h1>Drill<span>Caddie</span></h1>
        <p class="tagline">“the app that can fix your swing, just describe the problem.”</p>
        <button class="btn" onclick="navigateTo('loginPage')">Login to Get Started</button>
    </div>

    <!-- PAGE 2: LOGIN PAGE -->
    <div id="loginPage" class="page">
        <h2>Welcome Back</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>
    </div>

    <!-- PAGE 3: DASHBOARD -->
    <div id="dashboardPage" class="page">
        <h2>How can we fix your swing?</h2>
        <form id="drillForm" onsubmit="generateDrills(event)">
            <textarea id="swingProblem" placeholder="e.g., I keep shanking it, hit a bladed shot over the green, or hit it off the toe..." required></textarea>
            <button type="submit" class="btn">Get Fixing Drills</button>
        </form>

        <!-- Dynamic Output Area -->
        <div id="results" class="results-box">
            <h3>Recommended Drills:</h3>
            <p id="drillOutput"></p>
        </div>
    </div>

    <script>
        // Simple Page Router
        function navigateTo(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // Handle Login Submission
        function handleLogin(event) {
            event.preventDefault();
            navigateTo('dashboardPage');
        }

        // Expanded Simulated AI Drill Generator
        function generateDrills(event) {
            event.preventDefault();
            const problemText = document.getElementById('swingProblem').value.toLowerCase();
            const outputBox = document.getElementById('results');
            const outputText = document.getElementById('drillOutput');

            let drillRecommendation = "";

            // Keyword matching logic including new terms
            if (problemText.includes('slice')) {
                drillRecommendation = "<strong>1. The Headcover Drill:</strong> Place a headcover just outside your ball path. If you come over-the-top (causing a slice), you'll hit it. Practice swinging inside it.<br><br><strong>2. Lead-Arm Only:</strong> Take half-swings with just your lead arm to focus on squaring the clubface.";
            
            } else if (problemText.includes('hook')) {
                drillRecommendation = "<strong>1. Preset Impact Drill:</strong> Set up with your hips already slightly open. This prevents your hands from flipping over too early.<br><br><strong>2. Wide Stance Drill:</strong> Widen your stance to limit excessive hip slide and encourage steady rotation.";
            
            } else if (problemText.includes('fat') || problemText.includes('chunky') || problemText.includes('chunk')) {
                drillRecommendation = "<strong>1. The Towel Drill:</strong> Place a golf towel 4 inches behind the ball. Hit the ball cleanly without catching the towel. This fixes a 'chunky' shot by forcing a downward strike.<br><br><strong>2. Forward Weight Shift:</strong> Ensure 60% of your weight moves onto your lead foot at impact so you don't hit the ground early.";
            
            } else if (problemText.includes('thin') || problemText.includes('top') || problemText.includes('skinned') || problemText.includes('bladed')) {
                drillRecommendation = "<strong>1. The Coin Drill:</strong> Place a coin directly in front of your ball. Focus entirely on clipping that coin off the turf *after* striking the ball. This stops you from skulling, skinning, or blading it.<br><br><strong>2. Keep Your Spine Angle:</strong> Avoid standing up mid-swing. Keep your chest facing down through impact.";
            
            } else if (problemText.includes('shank')) {
                drillRecommendation = "<strong>1. Two-Ball Gate Drill:</strong> Set up two golf balls side by side, just wide enough for your clubhead to fit between. Address the inner ball, but swing and hit the outer ball (or vice-versa). This teaches you to stop pushing the hosel forward into the ball.<br><br><strong>2. Balance Check:</strong> Avoid leaning onto your toes during the downswing, which pushes the club too far out.";
            
            } else if (problemText.includes('toe')) {
                drillRecommendation = "<strong>1. Object Outside the Toe Drill:</strong> Place a water bottle or headcover just half an inch outside the toe of your club at address. Practice hitting balls without striking the object. This forces you to extend outward instead of pulling inside into the toe.<br><br><strong>2. Posture Extension:</strong> Make sure you aren't pulling your hips back away from the ball during impact.";
            
            } else if (problemText.includes('whiff')) {
                drillRecommendation = "<strong>1. The Tee Height Drill:</strong> Tee up a ball high and practice taking slow, 50% speed swings. Focus entirely on keeping your eyes fixed on the back of the ball. Whiffs usually come from lifting up or completely losing spatial awareness.<br><br><strong>2. Feet-Together Drill:</strong> Hit balls with your feet completely together to master your center of gravity and balance.";
            
            } else {
                // Default fallback response
                drillRecommendation = "<strong>1. Alignment Stick Drill:</strong> Lay a stick along your target line to guarantee your stance and shoulders are square.<br><br><strong>2. The 3-to-1 Tempo Drill:</strong> Count '1-2-3' on your backswing and '1' through impact to get your swing back in perfect rhythm.";
            }

            // Display results
            outputText.innerHTML = drillRecommendation;
            outputBox.style.display = 'block';
        }
    </script>
</body>
</html>
